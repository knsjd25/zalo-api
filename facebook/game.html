<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Fruit Match Loader</title>
  <meta name="description" content="Loading Fruit Match game..." />

  <style>
    :root {
      --primary: #7c5cff;
      --primary-dark: #5638d6;
      --orange: #ff8c5a;
      --text: #20263a;
      --muted: #7a8299;
      --bg-1: #f6f2ff;
      --bg-2: #fff4ec;
      --card: rgba(255, 255, 255, 0.86);
      --border: rgba(124, 92, 255, 0.16);
      --shadow: 0 22px 60px rgba(86, 56, 214, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.24), transparent 32%),
        radial-gradient(circle at bottom right, rgba(255, 140, 90, 0.2), transparent 34%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .loader-card {
      width: min(380px, 100%);
      padding: 28px 22px;
      border-radius: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 15px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 38px;
      font-weight: 1000;
      background: linear-gradient(135deg, var(--primary), var(--orange));
      box-shadow: 0 16px 32px rgba(124, 92, 255, 0.26);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .desc {
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 20px auto 0;
      border-radius: 999px;
      border: 4px solid rgba(124, 92, 255, 0.16);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    .status {
      margin-top: 14px;
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
      word-break: break-word;
    }

    .actions {
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .actions.show {
      display: grid;
    }

    .btn {
      height: 50px;
      border: 0;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 12px 24px rgba(86, 56, 214, 0.22);
    }

    .btn-secondary {
      color: var(--primary-dark);
      background: rgba(124, 92, 255, 0.1);
      border: 1px solid rgba(124, 92, 255, 0.14);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="loader-card">
    <div class="logo">M</div>
    <h1>Fruit Match</h1>
    <p class="desc" id="descText">
      Loading game page from server...
    </p>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="statusText">Checking game URL...</div>

    <div class="actions" id="actions">
      <button class="btn btn-primary" id="retryBtn" type="button">Try Again</button>
      <button class="btn btn-secondary" id="openBtn" type="button">Open Returned URL</button>
    </div>
  </main>

  <script>
    const SITE_API_URL = "https://api.yilunfan155.workers.dev/api/site?id=fb-test";
    const REQUEST_TIMEOUT_MS = 5000;

    let returnedUrl = "";

    const descText = document.getElementById("descText");
    const statusText = document.getElementById("statusText");
    const spinner = document.getElementById("spinner");
    const actions = document.getElementById("actions");
    const retryBtn = document.getElementById("retryBtn");
    const openBtn = document.getElementById("openBtn");

    function setStatus(message) {
      statusText.textContent = message;
    }

    function showError(message) {
      spinner.style.display = "none";
      actions.classList.add("show");
      setStatus(message);
    }

    function isSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }

    async function fetchWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal,
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("API status " + response.status);
        }

        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function loadAndOpenReturnedUrl() {
      spinner.style.display = "block";
      actions.classList.remove("show");
      returnedUrl = "";
      descText.textContent = "Loading game page from server...";
      setStatus("Requesting site API...");

      try {
        const data = await fetchWithTimeout(SITE_API_URL, REQUEST_TIMEOUT_MS);

        if (!data || data.ok !== true || !data.page || !data.page.url) {
          throw new Error("API did not return page.url.");
        }

        returnedUrl = String(data.page.url).trim();

        if (!isSafeHttpUrl(returnedUrl)) {
          throw new Error("Invalid page.url: " + returnedUrl);
        }

        descText.textContent = "Game URL received. Opening page...";
        setStatus(returnedUrl);

        /*
          Important:
          This page follows the API strictly:
          whatever page.url returns, the browser opens that URL.
        */
        window.location.replace(returnedUrl);
      } catch (error) {
        console.error("Failed to load returned URL:", error);
        showError("Failed to load page.url from API. Please retry.");
      }
    }

    retryBtn.addEventListener("click", loadAndOpenReturnedUrl);

    openBtn.addEventListener("click", () => {
      if (returnedUrl && isSafeHttpUrl(returnedUrl)) {
        window.location.href = returnedUrl;
        return;
      }

      loadAndOpenReturnedUrl();
    });

    loadAndOpenReturnedUrl();
  </script>
</body>
</html>
