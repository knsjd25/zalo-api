<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ghi nhanh số điện thoại</title>
  <meta name="description" content="Công cụ ghi nhanh số điện thoại trên điện thoại, lưu cục bộ trong trình duyệt." />
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #171923;
      --muted: #7a8193;
      --primary: #ff7a45;
      --primary-dark: #e9602d;
      --green: #22a06b;
      --danger: #e5484d;
      --line: #e8eaf1;
      --shadow: 0 14px 34px rgba(18, 24, 40, .10);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(255,122,69,.18), transparent 30%),
        radial-gradient(circle at 88% 8%, rgba(91,141,239,.18), transparent 32%),
        var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    .top {
      padding: 8px 2px 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,122,69,.12);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px rgba(255,122,69,.18);
    }

    h1 {
      margin: 14px 0 6px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.6px;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .quick-card {
      margin-top: 14px;
      background: var(--card);
      border: 1px solid rgba(232,234,241,.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #333948;
      font-size: 14px;
      font-weight: 800;
    }

    .phone-box {
      position: relative;
    }

    input[type="tel"] {
      width: 100%;
      height: 62px;
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 0 14px;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      background: #fbfcff;
      outline: none;
      letter-spacing: .5px;
    }

    input[type="tel"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255,122,69,.14);
      background: #fff;
    }

    .hint {
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 17px;
      min-height: 52px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .save {
      grid-column: span 2;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #ff9b55);
      box-shadow: 0 10px 22px rgba(255,122,69,.28);
    }

    .copy {
      color: var(--green);
      background: rgba(34,160,107,.11);
    }

    .clear {
      color: var(--danger);
      background: rgba(229,72,77,.10);
    }

    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 2px 10px;
    }

    .list-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.2px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 10px;
      padding-bottom: 10px;
    }

    .empty {
      margin-top: 8px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.62);
      border: 1px dashed #d9dde9;
      border-radius: 20px;
    }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(232,234,241,.92);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 10px 22px rgba(18,24,40,.06);
    }

    .num {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: .3px;
      word-break: break-all;
    }

    .time {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .mini-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      min-width: 42px;
      min-height: 42px;
      border-radius: 14px;
      font-size: 16px;
      background: #f1f3f8;
      color: #323846;
    }

    .icon-btn.del {
      background: rgba(229,72,77,.10);
      color: var(--danger);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(24px);
      width: calc(100% - 32px);
      max-width: 448px;
      padding: 14px 16px;
      border-radius: 16px;
      color: #fff;
      background: rgba(23,25,35,.94);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 700px) {
      body {
        background: #eef1f7;
      }

      .app {
        box-shadow: 0 0 0 1px rgba(0,0,0,.04);
        background:
          radial-gradient(circle at 12% 0%, rgba(255,122,69,.18), transparent 30%),
          radial-gradient(circle at 88% 8%, rgba(91,141,239,.18), transparent 32%),
          var(--bg);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="badge"><span class="dot"></span> Ghi nhanh</div>
      <h1>Sổ số điện thoại</h1>
      <p class="sub">Chỉ nhập số điện thoại. Lưu nhanh trên máy, không cần đăng nhập.</p>
    </section>

    <section class="quick-card">
      <label for="phone">Số điện thoại</label>
      <div class="phone-box">
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Nhập số..." autofocus />
      </div>
      <div class="hint">Mẹo: dán số vào ô này rồi bấm “Lưu số”.</div>

      <div class="actions">
        <button class="save" id="saveBtn">Lưu số</button>
        <button class="copy" id="copyBtn">Sao chép</button>
        <button class="clear" id="clearBtn">Xóa ô</button>
      </div>
    </section>

    <div class="list-head">
      <h2>Số đã lưu</h2>
      <div class="count" id="count">0 số</div>
    </div>

    <section class="list" id="list"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const KEY = 'quick_vn_phone_numbers_v1';
    const phoneInput = document.getElementById('phone');
    const saveBtn = document.getElementById('saveBtn');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const toastEl = document.getElementById('toast');

    let numbers = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function persist() {
      localStorage.setItem(KEY, JSON.stringify(numbers));
    }

    function cleanPhone(value) {
      return String(value || '')
        .replace(/[^\d+]/g, '')
        .replace(/(?!^)\+/g, '')
        .slice(0, 22);
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      return `${hh}:${mm} · ${day}/${month}/${d.getFullYear()}`;
    }

    function toast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        toast('Đã sao chép số điện thoại');
      } catch (e) {
        phoneInput.value = text;
        phoneInput.select();
        document.execCommand('copy');
        toast('Đã sao chép');
      }
    }

    function saveNumber() {
      const phone = cleanPhone(phoneInput.value);
      if (!phone || phone.length < 3) {
        toast('Vui lòng nhập số điện thoại');
        phoneInput.focus();
        return;
      }

      const existedIndex = numbers.findIndex(item => item.phone === phone);
      if (existedIndex >= 0) {
        numbers.splice(existedIndex, 1);
      }

      numbers.unshift({
        phone,
        createdAt: Date.now()
      });

      numbers = numbers.slice(0, 80);
      persist();
      phoneInput.value = '';
      render();
      toast('Đã lưu số điện thoại');
      phoneInput.focus();
    }

    function deleteNumber(index) {
      numbers.splice(index, 1);
      persist();
      render();
      toast('Đã xóa');
    }

    function render() {
      countEl.textContent = `${numbers.length} số`;

      if (!numbers.length) {
        listEl.innerHTML = '<div class="empty">Chưa có số nào. Nhập số ở trên để lưu nhanh.</div>';
        return;
      }

      listEl.innerHTML = numbers.map((item, index) => `
        <article class="item">
          <div>
            <div class="num">${escapeHtml(item.phone)}</div>
            <div class="time">${formatDate(item.createdAt)}</div>
          </div>
          <div class="mini-actions">
            <button class="icon-btn" data-copy="${index}" aria-label="Sao chép">📋</button>
            <button class="icon-btn del" data-del="${index}" aria-label="Xóa">×</button>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, s => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[s]));
    }

    phoneInput.addEventListener('input', () => {
      const cleaned = cleanPhone(phoneInput.value);
      if (phoneInput.value !== cleaned) phoneInput.value = cleaned;
    });

    phoneInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveNumber();
    });

    saveBtn.addEventListener('click', saveNumber);

    copyBtn.addEventListener('click', () => {
      const phone = cleanPhone(phoneInput.value);
      if (!phone) {
        toast('Ô nhập đang trống');
        phoneInput.focus();
        return;
      }
      copyText(phone);
    });

    clearBtn.addEventListener('click', () => {
      phoneInput.value = '';
      phoneInput.focus();
    });

    listEl.addEventListener('click', (e) => {
      const copyBtn = e.target.closest('[data-copy]');
      const delBtn = e.target.closest('[data-del]');

      if (copyBtn) {
        const index = Number(copyBtn.dataset.copy);
        copyText(numbers[index].phone);
      }

      if (delBtn) {
        const index = Number(delBtn.dataset.del);
        deleteNumber(index);
      }
    });

    render();

    setTimeout(() => phoneInput.focus(), 300);
  </script>
</body>
</html>
